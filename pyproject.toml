[project]
name = "expressbus"
version = "0.1.0"
description = "Expressbusse trotz Fahrermangel – Umlauf- und Dienstplanungs-Prototyp (Claude Code Impact Lab Nürnberg, Track 1)"
authors = [
    { name = "Harun Nakas", email = "harunnakas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "ortools>=9.15.6755",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
